<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Concursos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B1220'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial' font-weight='700' fill='%233D8BFD'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* Paleta azul, preto e branco. Estrutura herdada da Trilha GFC: trilho lateral, faixa de título, fases com estações, PDCA por módulo. */
:root{
  --az:#1554C0; --az-esc:#0D3B8C; --az-cl:#E6EEFC; --az-vivo:#3D8BFD;
  --pre:#0B1220; --gra:#1B2433; --bra:#FFFFFF; --nev:#F3F6FA; --lin:#D5DCE6;
  --txt:#0B1220; --sub:#56627A; --ver:#C21F3A; --ok:#1E7B45; --lar:#B5620C;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bra)}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--az)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--az-vivo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--pre) 240px,var(--bra) 240px)}
.rail{background:var(--pre);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.marca{background:var(--az);padding:18px 20px 16px;display:block;text-decoration:none;color:#fff}
.marca .wm{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.3px;line-height:1}
.marca .wm b{color:#BFD6FF;font-weight:700}
.marca small{display:block;font-size:12.5px;opacity:.85;margin-top:4px}
.quem{padding:16px 22px 12px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.12)}
.quem strong{display:block;font-size:16px}
.quem a{color:#9CC0FF;font-size:13.5px;text-decoration:none}
.rail nav{padding:8px 0;flex:1;overflow:auto}
.rail nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 22px;color:#E8EEF8;font-weight:600;text-decoration:none;border-left:5px solid transparent}
.rail nav a:hover{background:rgba(255,255,255,.06)}
.rail nav a.ativo{background:rgba(61,139,253,.16);border-left-color:var(--az-vivo);color:#fff}
.badge{background:var(--az-vivo);color:#fff;border-radius:10px;padding:0 8px;font-size:13px;font-weight:700;min-width:22px;text-align:center}
.rail .pe{padding:14px 22px 18px;font-size:12.5px;color:rgba(255,255,255,.65);border-top:1px solid rgba(255,255,255,.12)}
.rail .pe .sync{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#3FBF76;display:inline-block}
.dot.local{background:#F0A030} .dot.salvando{background:var(--az-vivo)}
.main{min-width:0;display:flex;flex-direction:column}
.topo{background:var(--gra);color:#fff;padding:26px 44px 22px;border-bottom:5px solid var(--az)}
.topo h1{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:clamp(28px,4vw,42px);letter-spacing:.4px;margin:0;line-height:1.02}
.topo p{margin:6px 0 0;color:#D3DCEA;max-width:72ch}
.topo .volta{display:inline-block;color:#9CC0FF;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
.conteudo{padding:30px 44px 72px;max-width:1140px;width:100%}
.faixa{background:var(--az-cl);padding:14px 20px;font-style:italic;font-weight:500;margin:0 0 26px;border-left:6px solid var(--az)}

h2{font-family:var(--cond);font-weight:700;font-size:26px;text-transform:uppercase;margin:34px 0 12px;line-height:1.1}
h2:first-child{margin-top:0}
h3{font-family:var(--cond);font-weight:600;font-size:21px;margin:24px 0 8px;line-height:1.15}
h4{font-size:16px;margin:16px 0 6px}
.sub{color:var(--sub)}
.peq{font-size:14px}
p{margin:0 0 12px;max-width:78ch}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--az);color:#fff;border:0;border-radius:2px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 var(--az-esc)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.escuro{background:var(--pre);box-shadow:0 2px 0 #000}
.btn.linha{background:transparent;box-shadow:inset 0 0 0 2px var(--gra);color:var(--gra)}
.btn.perigo{background:transparent;box-shadow:inset 0 0 0 2px var(--ver);color:var(--ver)}
.btn.mini{padding:5px 11px;font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.painel{border:1px solid var(--lin);background:#fff;padding:20px 22px;margin-bottom:18px}
.painel.cinza{background:var(--nev);border-color:transparent}
.painel.destaque{border:2px solid var(--pre);box-shadow:5px 5px 0 var(--az)}
.grade{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.num{border-top:4px solid var(--az);padding-top:10px}
.num .v{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.num .l{font-size:14px;color:var(--sub)}

label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid #B9C3D2;background:#fff;padding:9px 11px;border-radius:2px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--az)}
.linha-form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ajuda{font-size:13px;color:var(--sub);margin-top:4px}

.tabela-wrap{overflow-x:auto;border:1px solid var(--lin)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--pre);color:#fff;text-align:left;font-weight:600;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--lin);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--nev);font-weight:700}

.st{display:inline-block;padding:2px 9px;font-size:13px;font-weight:600;border-radius:2px;white-space:nowrap}
.st-bloqueado{background:#ECEFF3;color:#7B8597}
.st-disponivel{background:var(--az-cl);color:var(--az-esc)}
.st-estudo{background:#DCE9FF;color:var(--az)}
.st-teste{background:var(--az);color:#fff}
.st-autocorrecao{background:#E7E2F6;color:#4B3A8C}
.st-reciclagem{background:#FBE6D3;color:var(--lar)}
.st-aprovado{background:#DCF1E4;color:var(--ok)}
.st-aguardando{background:#ECEFF3;color:#7B8597}
.st-andamento{background:#DCE9FF;color:var(--az)}
.st-simulado{background:var(--pre);color:#fff}
.st-concluida{background:#DCF1E4;color:var(--ok)}

.atencao{border-top:2px solid var(--az);border-bottom:2px solid var(--az);padding:12px 8px;margin:16px 0;text-align:center;font-style:italic}
.atencao b{color:var(--ver);font-weight:700}
.lista{margin:0 0 12px;padding-left:20px}
.lista li{margin-bottom:6px;max-width:78ch}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-weight:400;font-size:16px;margin:0}
.check input{width:20px;height:20px;accent-color:var(--az);margin-top:2px;flex:none}
.barra{height:10px;background:#E3E8EF;position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--az)}
.aviso{padding:12px 16px;border-left:5px solid var(--lar);background:#FFF4E8;margin:12px 0}
.aviso.ok{border-color:var(--ok);background:#ECF7F0}
.aviso.info{border-color:var(--az);background:#EEF3FC}
.aviso.erro{border-color:var(--ver);background:#FCEBEE}
.vazio{padding:26px;text-align:center;color:var(--sub);border:2px dashed var(--lin)}
.exemplo{background:var(--nev);border-left:4px solid var(--gra);padding:10px 14px;margin:8px 0 14px;font-size:15px}
.exemplo b:first-child{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:2px}
.formula{font-family:ui-monospace,Consolas,monospace;background:var(--pre);color:#E8EEF8;padding:10px 14px;margin:8px 0 14px;overflow-x:auto;white-space:pre}
.dica{border:1px dashed var(--az);padding:10px 14px;margin:10px 0 14px;font-size:15px}
.dica b:first-child{color:var(--az)}

/* ---------- trilha ---------- */
.trilho{margin:8px 0 6px}
.fase{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--lin)}
.fase .fn{font-family:var(--cond);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--sub);line-height:1.2}
.fase .fn b{display:block;font-size:44px;color:var(--pre);line-height:.95}
.fase .fn .st{white-space:normal}
.estacoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.estacao{display:block;text-decoration:none;color:var(--txt);border:1px solid var(--lin);padding:12px 14px 13px;background:#fff}
.estacao:hover{border-color:var(--az)}
.estacao .cod{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--sub)}
.estacao .tit{font-weight:600;line-height:1.25;margin:2px 0 8px;display:block}
.estacao .disc{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.estacao.atual{border:2px solid var(--pre);box-shadow:5px 5px 0 var(--az)}
.estacao.bloq{opacity:.6}
.estacao.feito{background:var(--nev)}
.estacao.sim{background:var(--pre);color:#fff;border-color:var(--pre)}
.estacao.sim .cod,.estacao.sim .disc{color:#AFC4E6}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card-trilha{border:1px solid var(--lin);background:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card-trilha.ativa{border:2px solid var(--pre);box-shadow:5px 5px 0 var(--az)}
.card-trilha .tt{font-family:var(--cond);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1}
.card-trilha .cg{font-weight:600}
.card-trilha .acoes{margin-top:auto}

/* ---------- PDCA ---------- */
.pdca-wrap{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center}
.pdca svg{width:100%;height:auto;display:block}
.pdca-leg{display:grid;gap:10px}
.pdca-leg div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.pdca-leg b{font-family:var(--cond);font-size:24px;line-height:1;width:34px;height:34px;display:grid;place-items:center;background:#E8ECF2;color:#8B95A7}
.pdca-leg .feito b{background:var(--pre);color:#fff}
.pdca-leg .agora b{background:var(--az);color:#fff}
.pdca-leg span{font-size:14.5px}
.pdca-leg strong{display:block;font-size:15px}
.plano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--lin);margin-bottom:24px}
.plano div{padding:12px 14px;border-left:1px solid var(--lin)}
.plano div:first-child{border-left:0}
.plano small{display:block;color:var(--sub);font-size:13px}
.plano strong{font-family:var(--cond);font-size:22px;line-height:1.1}

/* ---------- questões ---------- */
.questao{border:1px solid var(--lin);padding:18px 20px;margin-bottom:16px;background:#fff}
.questao .qh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.questao .qn{font-family:var(--cond);font-weight:700;font-size:20px}
.questao .qt{font-size:13px;color:var(--sub);white-space:nowrap}
.questao .base{background:var(--nev);padding:10px 14px;margin-bottom:10px;font-size:15px;white-space:pre-wrap}
.questao .enun{font-weight:600;margin-bottom:12px;max-width:80ch;white-space:pre-wrap}
.opcao{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid transparent;cursor:pointer}
.opcao:hover{background:var(--nev)}
.opcao input{margin-top:4px;accent-color:var(--az);flex:none}
.opcao .let{font-weight:700;min-width:18px}
.opcao.certa{border-color:var(--ok);background:#ECF7F0}
.opcao.errada{border-color:var(--ver);background:#FCEBEE}
.ce{display:flex;gap:10px;flex-wrap:wrap}
.ce label{display:flex;align-items:center;gap:8px;border:1px solid var(--lin);padding:7px 14px;margin:0;cursor:pointer;font-weight:600}
.ce label input{accent-color:var(--az)}
.resposta{background:var(--nev);padding:10px 14px;white-space:pre-wrap;border-left:4px solid var(--gra);margin:6px 0}
.gabarito{background:var(--az-cl);padding:10px 14px;border-left:4px solid var(--az);margin:8px 0;font-size:15px}
.gabarito b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.resultado{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:18px 22px;background:var(--pre);color:#fff;margin:18px 0}
.resultado .nota{font-family:var(--cond);font-size:56px;font-weight:700;line-height:1;color:#7FB2FF}
.resultado .rot{font-family:var(--cond);font-size:22px;text-transform:uppercase;font-weight:700}
details.acc{border:1px solid var(--lin);margin-bottom:10px;background:#fff}
details.acc>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-family:var(--cond);font-size:22px;line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>.corpo{padding:4px 16px 16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login .lado{background:var(--pre);color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border-right:8px solid var(--az)}
.login .lado h1{overflow-wrap:break-word;font-family:var(--cond);font-weight:700;font-size:clamp(42px,5.6vw,80px);line-height:.92;text-transform:uppercase;margin:24px 0 18px}
.login .lado h1 span{color:var(--az-vivo)}
.login .lado p{font-weight:500;max-width:44ch;color:#D3DCEA}
.login .form{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;max-width:580px}
.selo{background:var(--az);color:#fff;font-family:var(--cond);font-weight:700;font-size:22px;padding:6px 12px;align-self:flex-start}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pre);color:#fff;padding:12px 20px;border-left:6px solid var(--az-vivo);z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.erro{border-left-color:var(--ver)}
.carregando{min-height:100vh;display:grid;place-items:center;font-family:var(--cond);font-size:26px;text-transform:uppercase;background:var(--pre);color:#fff}
.modal-fundo{position:fixed;inset:0;background:rgba(11,18,32,.55);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:#fff;max-width:480px;width:100%;padding:22px 24px;border-top:6px solid var(--az)}
.modal p{margin-bottom:6px}

/* ---------- gráficos e indicadores ---------- */
.grafico{border:1px solid var(--lin);padding:14px 16px 10px;background:#fff;margin-bottom:18px}
.grafico h3{margin:0 0 2px}
.grafico .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub);margin:4px 0 6px}
.grafico .leg i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:5px}
.grafico svg{width:100%;height:auto;display:block}
.medidor{display:grid;grid-template-columns:200px 1fr 52px;gap:10px;align-items:center;font-size:14.5px;margin:6px 0}
.semaforo{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.semaforo i{width:12px;height:12px;border-radius:50%;display:inline-block}
.duvida{border:1px solid var(--lin);padding:14px 18px;margin-bottom:12px;background:#fff}
.duvida .meta{font-size:13px;color:var(--sub);margin-bottom:6px}
.duvida .perg{white-space:pre-wrap;font-weight:500}
.duvida .resp{background:#EEF3FC;border-left:4px solid var(--az);padding:8px 14px;margin-top:10px;white-space:pre-wrap}
.duvida .resp small{display:block;color:var(--sub)}
.duvida.aberta{border-left:5px solid var(--az)}
.cap-semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bra)}
  .rail{position:static;height:auto;min-width:0}
  .rail nav{display:flex;overflow-x:auto;padding:0}
  .rail nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:10px 14px}
  .rail nav a.ativo{border-bottom-color:var(--az-vivo)}
  .quem,.rail .pe{display:none}
  .topo{padding:22px 20px 18px}
  .conteudo{padding:22px 20px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .fase{grid-template-columns:1fr;gap:8px}
  .fase .fn b{display:inline;font-size:30px;margin-right:6px}
  .pdca-wrap{grid-template-columns:1fr}
  .pdca{max-width:200px}
  .plano{grid-template-columns:1fr 1fr}
  .plano div:nth-child(3){border-left:0}
  .plano div:nth-child(n+3){border-top:1px solid var(--lin)}
  .login{grid-template-columns:1fr}
  .login .lado{padding:30px 22px;border-right:0;border-bottom:8px solid var(--az)}
  .login .form{padding:28px 22px}
  .medidor{grid-template-columns:120px 1fr 44px}
  .cap-semana{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media print{.rail,.acoes,.btn{display:none!important}.app{display:block}.topo{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando a trilha…</div></div>
<script src="config.js"></script>
<script src="trilhas.js"></script>
<script src="conteudo/portugues.js"></script>
<script src="conteudo/matematica.js"></script>
<script src="conteudo/informatica.js"></script>
<script src="conteudo/etica-linguas.js"></script>
<script src="conteudo/prf-transito.js"></script>
<script src="conteudo/prf-direito.js"></script>
<script src="conteudo/prf-gerais.js"></script>
<script src="conteudo/bb-bancarios.js"></script>
<script src="conteudo/bb-vendas-financeira.js"></script>
<script src="conteudo/bb-tecnologia.js"></script>
<script src="conteudo/detran.js"></script>
<script src="conteudo/redacao.js"></script>
<script>
"use strict";
/* =====================================================================
   TRILHA CONCURSOS — plataforma de estudo baseada na Trilha GFC.
   Vários alunos, cada um com nome + PIN, escolhe a trilha (concurso/cargo).
   Cada módulo é um ciclo PDCA: planejar → estudar → teste → agir.
   Cada fase termina com uma prova anterior real (simulado).
   Base de dados: um JSON no GitHub (API de Contents) ou só no navegador.
   ===================================================================== */
const TR = window.TRILHAS || {};
const MODLIB = window.MODULOS || {};
const CFG = window.TC_CONFIG || {};
const K_CFG = "tc_cfg", K_DB = "tc_db", K_SES = "tc_sessao", K_RASC = "tc_rasc_";
const S = { db: null, sha: null, user: null, salvando: false, erroCarga: null };
const PDCA = {
  P: { nome: "Planejar", texto: "Horas de estudo e nota mínima definidas pelo peso da disciplina no edital. Ao iniciar, o prazo do teste é calculado pela sua rotina." },
  D: { nome: "Executar", texto: "Estudo do conteúdo completo no site, checklist, anotações e dúvidas." },
  C: { nome: "Checar", texto: "Teste no estilo da banca. Abaixo da nota mínima, o módulo volta para revisão." },
  A: { nome: "Agir", texto: "Aprovado: módulo concluído. No fim da fase, resolva a prova anterior e registre o resultado." }
};

/* ------------------------------ utilidades ------------------------------ */

function curvaS(tid = TID()) {
  const a = eu(); const pl = planejamento(tid); const ini = a?.trilhas?.[tid]?.inicio; if (!pl.length || !ini) return "";
  const fim = [pl.at(-1).fim, previsao(tid) || hoje(), hoje()].sort().at(-1); const sem = Math.max(1, Math.ceil(diasEntre(ini, fim) / 7)) + 1;
  const datas = Array.from({ length: sem }, (_, i) => { const d = parse(ini); d.setDate(d.getDate() + i * 7); return iso(d); });
  const planV = datas.map(d => pl.filter(x => x.fim <= d).length);
  const cnt = d => modsT(tid).filter(m => { const p = prog(m.id, tid); return p?.status === "aprovado" && p.aprovadoEm <= d; }).length;
  const realV = datas.map((d, i) => d <= hoje() ? cnt(d) : i > 0 && datas[i - 1] <= hoje() ? cnt(hoje()) : null);
  return grafLinhas({ labels: datas.map((_, i) => "S" + i), series: [{ nome: "Planejado (acumulado)", v: planV, cor: "#9AA8BE", dash: "6 4", semPontos: true }, { nome: "Realizado (acumulado)", v: realV, cor: "#1554C0" }], min: 0, max: Math.max(pl.length, 1), passo: Math.max(1, Math.ceil(pl.length / 5)) });
}

/* ------------------------------ PDCA ------------------------------ */
function anelPDCA(atual, concluido) {
  const ordem = ["P", "D", "C", "A"]; const ia = ordem.indexOf(atual); const feito = i => concluido || (ia > -1 && i < ia);
  const quad = [["P", "M100,100 L100,8 A92,92 0 0,1 192,100 Z", 146, 74], ["D", "M100,100 L192,100 A92,92 0 0,1 100,192 Z", 146, 150], ["C", "M100,100 L100,192 A92,92 0 0,1 8,100 Z", 54, 150], ["A", "M100,100 L8,100 A92,92 0 0,1 100,8 Z", 54, 74]];
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Ciclo PDCA do módulo: etapa ${atual || "não iniciada"}">${quad.map(([k, d, x, y], i) => `<path d="${d}" fill="${feito(i) ? "#0B1220" : k === atual ? "#1554C0" : "#E3E8EF"}" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y + 12}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="38" fill="${feito(i) || k === atual ? "#fff" : "#9AA8BE"}">${k}</text>`).join("")}<circle cx="100" cy="100" r="30" fill="#0B1220"/><text x="100" y="107" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${concluido ? 18 : 20}" fill="#7FB2FF">${concluido ? "OK" : atual || "—"}</text></svg>`;
}
function legendaPDCA(atual, concluido) { const o = ["P", "D", "C", "A"], ia = o.indexOf(atual); return `<div class="pdca-leg">${o.map((k, i) => `<div class="${concluido || (ia > -1 && i < ia) ? "feito" : k === atual ? "agora" : ""}"><b>${k}</b><span><strong>${PDCA[k].nome}</strong>${PDCA[k].texto}</span></div>`).join("")}</div>`; }

      <div class="conteudo">${corpo}</div></main></div>`;

async function render() {
  const app = $("#app");
  if (S.erroCarga) { app.innerHTML = telaErro(); ligar(); return; }
  if (!S.db) return;
  const r = rota();
  if (r[0] === "config" && !S.user) { app.innerHTML = telaConfig(true); ligar(); return; }
  if (r[0] === "sair") { ss.del(K_SES); S.user = null; location.hash = "#/"; return; }
  if (!S.user) { app.innerHTML = telaLogin(); ligar(); return; }
  let html;
  if (r[0] === "trilhas" || !T()) html = telaTrilhas();
  else switch (r[0]) {
    case "modulo": html = telaModulo(r[1]); break;
    case "teste": html = telaTeste(r[1]); break;
    case "tentativa": html = telaTentativa(r[1], r[2]); break;
    case "fase": html = telaFase(r[1]); break;
    case "edital": html = telaEdital(); break;
    case "resultados": html = telaResultados(); break;
    case "duvidas": html = telaDuvidas(); break;
    case "questoes": html = telaQuestoes(); break;
    case "turma": html = telaTurma(); break;
    case "config": html = telaConfig(false); break;
    default: html = telaTrilha();
  }
  app.innerHTML = html; atualizarSync(); ligar(); window.scrollTo?.(0, 0);
}

  if (fsPend) { tituloAgora = `Fase ${fsPend.n}: prova anterior`; proximo = `<p>Você concluiu todos os módulos da fase. Agora resolva a prova anterior e registre o resultado para fechar o ciclo da fase.</p><div class="acoes"><a class="btn" href="#/fase/${fsPend.n}">Abrir a prova da fase</a></div>`; }
  else if (m) { tituloAgora = `${m.cod} · ${m.titulo}`; proximo = `<p class="sub">${esc(m.disciplina)} · Fase ${m.fase}</p><p>${chip(s.st)}</p><div class="acoes"><a class="btn" href="#/modulo/${m.id}">${s.st === "disponivel" ? "Planejar e iniciar" : s.st === "teste" ? "Fazer o teste" : s.st === "autocorrecao" ? "Corrigir dissertativas" : "Continuar estudando"}</a></div>`; }

        ${q.tipo === "mc" ? q.opcoes.map((o, k) => `<div class="opcao ${k === q.correta ? "certa" : ""}" style="cursor:default"><span class="let">${LET[k]}</span><span>${esc(o)}</span></div>`).join("") : q.tipo === "ce" ? `<p>Gabarito: <b>${q.certo ? "Certo" : "Errado"}</b></p>` : `<div class="gabarito"><b>Gabarito comentado</b>${esc(q.esperado || "—")}</div>`}
        ${q.explicacao ? `<div class="gabarito"><b>Explicação</b>${esc(q.explicacao)}</div>` : ""}
        <div class="acoes"><button class="btn linha mini" data-acao="toggle-questao" data-q="${q.id}">${S.db.questoesOff[q.id] ? "Reativar" : "Desativar"}</button>${q.extra ? `<button class="btn perigo mini" data-acao="apagar-questao" data-mod="${m.id}" data-q="${q.id}">Excluir</button>` : ""}</div></div>`).join("")}
      <h3>Nova questão</h3><div class="linha-form"><div><label for="nq-t-${m.id}">Tipo</label><select id="nq-t-${m.id}"><option value="mc">Múltipla escolha</option><option value="ce">Certo ou errado</option><option value="aberta">Dissertativa</option></select></div></div>
      <label for="nq-e-${m.id}">Enunciado</label><textarea id="nq-e-${m.id}" style="min-height:70px"></textarea>
      <label for="nq-o-${m.id}">Múltipla escolha: alternativas, uma por linha, a correta começa com *. Certo/errado: escreva C ou E.</label><textarea id="nq-o-${m.id}" style="min-height:90px" placeholder="*Alternativa correta&#10;Alternativa errada"></textarea>
      <label for="nq-g-${m.id}">Explicação ou gabarito comentado</label><textarea id="nq-g-${m.id}" style="min-height:70px"></textarea><div class="acoes"><button class="btn escuro mini" data-acao="add-questao" data-mod="${m.id}">Adicionar questão</button></div></div></details>`; }).join("")).join(""), { ativo: "questoes", sub: esc(T().nome + " · " + T().cargo) });
}

/* ------------------------------ configurações ------------------------------ */
function telaConfig(publico) {
  const c = Store.cfg(); const a = S.user ? eu() : null; const capA = a ? cap() : null;
  const corpo = `<h2>Onde a base de dados fica</h2><p>A plataforma grava tudo num arquivo JSON dentro de um repositório do GitHub, e todos que usam o mesmo repositório estudam na mesma base. Sem token, a base fica só neste navegador.</p>
    <div class="painel"><label class="check"><input type="radio" name="modo" value="github" ${c.modo === "github" ? "checked" : ""}><span><b>GitHub</b>: base compartilhada entre a turma</span></label><label class="check"><input type="radio" name="modo" value="local" ${c.modo !== "github" ? "checked" : ""}><span><b>Só este navegador</b>: para testar ou estudar sozinho num aparelho</span></label>
      <div class="linha-form"><div><label for="c-owner">Usuário</label><input id="c-owner" type="text" value="${esc(c.owner)}"></div><div><label for="c-repo">Repositório</label><input id="c-repo" type="text" value="${esc(c.repo)}"></div><div><label for="c-branch">Branch</label><input id="c-branch" type="text" value="${esc(c.branch)}"></div><div><label for="c-path">Arquivo</label><input id="c-path" type="text" value="${esc(c.path)}"></div></div>
      <label for="c-token">Token de acesso (fine-grained, Contents: Read and write)</label><input id="c-token" type="password" value="${esc(c.token)}" autocomplete="off" placeholder="github_pat_…"><p class="ajuda">O token fica guardado só neste navegador.</p>
      <div class="acoes"><button class="btn" data-acao="salvar-config">Salvar e reconectar</button><button class="btn linha" data-acao="testar-config">Testar conexão</button></div><div id="c-res"></div></div>
    ${a ? `<h2>Sua rotina de estudo</h2><div class="painel"><p>Horas que você estuda em cada dia da semana. O prazo de cada teste é calculado a partir destas horas e da carga do módulo.</p>
      <div class="cap-semana">${[1, 2, 3, 4, 5, 6, 0].map(d => `<div><label for="cap-${d}">${DIAS[d]}</label><input id="cap-${d}" type="number" min="0" max="16" step="0.5" value="${capA[d]}"></div>`).join("")}</div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="cf-livre" ${a.ordemLivre ? "checked" : ""}><span><b>Ordem livre:</b> abrir todas as fases sem esperar a anterior terminar.</span></label>
      <div class="acoes"><button class="btn escuro" data-acao="salvar-rotina">Salvar rotina</button></div></div>
      <h2>Seu acesso</h2><div class="painel"><div class="linha-form"><div><label for="p-nome">Nome</label><input id="p-nome" type="text" value="${esc(a.nome)}"></div><div><label for="p-pin">Novo PIN (vazio mantém)</label><input id="p-pin" type="password" inputmode="numeric"></div></div><div class="acoes"><button class="btn escuro" data-acao="salvar-perfil">Salvar</button><button class="btn perigo" data-acao="zerar-trilha">Zerar meu progresso nesta trilha</button></div></div>
      <h2>Cópia de segurança</h2><div class="painel"><div class="acoes"><button class="btn escuro" data-acao="exportar">Baixar base (.json)</button><label class="btn linha" style="margin:0">Importar base (.json)<input type="file" accept="application/json" data-acao="importar" hidden></label></div></div>` : ""}`;
  if (publico) return `<div class="login"><div class="lado"><div><span class="selo">Trilha Concursos</span><h1>Configurar <span>armazenamento</span></h1><p><a href="#/" style="color:#9CC0FF">← Voltar para o login</a></p></div></div><div class="form" style="max-width:720px">${corpo}</div></div>`;
  return shell("Configurações", corpo, { ativo: "config" });
}

/* ------------------------------ eventos ------------------------------ */
const val = id => ($("#" + id)?.value ?? "").trim();
function ligar() {
  $$("[data-acao]").forEach(el => { const ev = el.tagName === "INPUT" && el.type === "file" ? "change" : "click"; el.addEventListener(ev, e => { if (el.tagName === "A" && el.dataset.acao) e.preventDefault(); acoes[el.dataset.acao]?.(el, e); }); });
  $("#l-pin")?.addEventListener("keydown", e => { if (e.key === "Enter") acoes.entrar(); });
  $$("[data-ck]").forEach(el => el.addEventListener("change", () => { const mid = el.dataset.mod, i = el.dataset.ck, v = el.checked, aid = S.user.id, tid = TID();
    agendar(db => { const p = db.progresso[aid]?.[tid]?.[mid]; if (p) { p.checklist = p.checklist || {}; p.checklist[i] = v; } }, `checklist ${mid}`);
    if (situacao(mid).st === "teste" && v) { toast("Checklist completo: teste liberado."); setTimeout(render, 300); } }));
  $$("[data-anot]").forEach(el => el.addEventListener("input", () => { const mid = el.dataset.mod, v = el.value, aid = S.user.id, tid = TID(); agendar(db => { const p = db.progresso[aid]?.[tid]?.[mid]; if (p) p.anotacoes = v; }, `anotações ${mid}`); }));
  const salvaRasc = () => { const r = rota(); if (r[0] !== "teste") return; ls.set(K_RASC + S.user.id + TID() + r[1], JSON.stringify(coletarRespostas())); };
  $$("[data-resp]").forEach(el => el.addEventListener(el.type === "radio" ? "change" : "input", salvaRasc));
}
function coletarRespostas() { const r = {}; $$("[data-resp]").forEach(el => { const q = el.dataset.resp; if (el.type === "radio") { if (el.checked) r[q] = /^\d+$/.test(el.value) ? Number(el.value) : el.value; } else r[q] = el.value; }); return r; }
const pinOk = p => /^\d{4,8}$/.test(p);
function garantirProg(db, aid, tid) { db.progresso[aid] = db.progresso[aid] || {}; db.progresso[aid][tid] = db.progresso[aid][tid] || {}; return db.progresso[aid][tid]; }

const acoes = {
  recarregar: () => location.reload(),
  "limpar-erro": () => { S.erroCarga = null; if (!S.db) S.db = migrar(novoDB()); ir("/config"); },
  "usar-local": () => { const c = Store.cfg(); c.modo = "local"; Store.salvarCfg(c); location.reload(); },
  async "criar-aluno"() {
    const nome = val("i-nome"), pin = val("i-pin"), pin2 = val("i-pin2"), trilha = val("i-trilha");
    if (!nome) return toast("Informe seu nome.", true); if (!pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true); if (pin !== pin2) return toast("Os PINs não conferem.", true);
    if (S.db.alunos.some(a => a.nome.toLowerCase() === nome.toLowerCase() && a.ativo !== false)) return toast("Já existe um acesso com esse nome. Use outro nome ou entre com o seu PIN.", true);
    const id = "a" + uid(); const h = await hashPin(id, pin); S.user = { id };
    const ok = await salvar(db => { db.alunos.push({ id, nome, pinHash: h, criadoEm: new Date().toISOString(), trilhaAtiva: trilha, trilhas: { [trilha]: { inicio: hoje() } }, capacidade: { ...CAP_PADRAO }, ordemLivre: false, ativo: true }); }, `novo acesso: ${nome}`);
    if (ok) { ss.set(K_SES, JSON.stringify(S.user)); ir("/trilha"); } else S.user = null;
  },
  async entrar() {
    const id = val("l-aluno"), pin = val("l-pin");
    try { await Store.carregar(); } catch (e) { return toast(e.message, true); }
    const a = aluno(id); if (!a) return toast("Selecione seu nome.", true); if (await hashPin(id, pin) !== a.pinHash) return toast("PIN incorreto.", true);
    S.user = { id }; ss.set(K_SES, JSON.stringify(S.user)); ir("/trilha");
  },
  "ativar-trilha"(el) { const t = el.dataset.t, aid = S.user.id; salvar(db => { const a = db.alunos.find(x => x.id === aid); a.trilhaAtiva = t; a.trilhas = a.trilhas || {}; if (!a.trilhas[t]) a.trilhas[t] = { inicio: hoje() }; }, `trilha ativa: ${t}`, `Trilha ${TR[t].nome} · ${TR[t].cargo}.`).then(ok => ok && ir("/trilha")); },
  iniciar(el) {
    const mid = el.dataset.mod, aid = S.user.id, tid = TID(); const m = modPorId(mid); if (situacao(mid).st !== "disponivel") return toast("Módulo ainda não liberado.", true);
    const prazo = addHoras(hoje(), m.horas);
    salvar(db => { const pr = garantirProg(db, aid, tid); if (pr[mid]) return; pr[mid] = { status: "estudo", inicio: hoje(), prazo, liberado: false, checklist: {}, anotacoes: "", tentativas: [] }; }, `iniciou ${mid}`, "Módulo iniciado. Bons estudos.");
  },
  "liberar-teste"(el) { const mid = el.dataset.mod, aid = S.user.id, tid = TID(); salvar(db => { const p = db.progresso[aid]?.[tid]?.[mid]; if (p) p.liberado = true; }, `liberou o teste de ${mid}`, "Teste liberado.").then(ok => ok && ir("/teste/" + mid)); },
  async refazer(el) { const mid = el.dataset.mod; if (!(await confirmar("Refazer o teste para revisar? A nota do módulo só muda se a nova for maior.", "Refazer"))) return; const aid = S.user.id, tid = TID(); salvar(db => { const p = db.progresso[aid]?.[tid]?.[mid]; if (p) { p.revisando = true; p.status = "estudo"; p.liberado = true; } }, `revisão de ${mid}`).then(ok => ok && ir("/teste/" + mid)); },
  async "enviar-teste"(el) {
    const mid = el.dataset.mod, aid = S.user.id, tid = TID(); const qs = questoesDe(mid); const r = coletarRespostas(); const estilo = T().estilo;
    const falta = qs.filter(q => q.tipo === "aberta" ? !(r[q.id] || "").trim() : r[q.id] === undefined); if (falta.length) return toast(`Responda todas as questões (${falta.length} sem resposta${estilo === "ce" ? "; nos itens C/E você pode marcar 'em branco'" : ""}).`, true);
    if (!(await confirmar("Enviar o teste? As respostas não podem ser alteradas depois.", "Enviar"))) return;
    const notas = {}; let acertos = 0, erros = 0, brancos = 0, abertas = false;
    for (const q of qs) { const pt = pontuar(q, r[q.id], estilo); notas[q.id] = pt; if (pt.nota == null) { abertas = true; continue; } if (q.tipo === "ce" && (r[q.id] === "B")) brancos++; else if (pt.nota > 0) acertos++; else erros++; }
    const m = modPorId(mid); const tent = { id: "t" + uid(), em: new Date().toISOString(), questoes: qs, respostas: r, notas, acertos, erros, brancos, notaMin: m.notaMin };
    if (!abertas) { tent.status = "avaliada"; tent.nota = calcNota(tent); tent.aprovado = tent.nota >= m.notaMin; } else tent.status = "autocorrecao";
    salvar(db => fecharTentativa(db, aid, tid, mid, tent), `enviou o teste de ${mid}`, abertas ? "Teste enviado. Agora corrija as dissertativas." : tent.aprovado ? `Nota ${nota1(tent.nota)}: módulo concluído.` : `Nota ${nota1(tent.nota)}: abaixo da mínima. Revise e refaça.`)
      .then(ok => { if (ok) { ls.del(K_RASC + aid + tid + mid); ir(`/tentativa/${mid}/${tent.id}`); } });
  },
  "concluir-autocorrecao"(el) {
    const mid = el.dataset.mod, tid0 = el.dataset.tent, aid = S.user.id, tid = TID(); const sel = $$("[data-auto]"); if (sel.some(s => s.value === "")) return toast("Marque a autocorreção de todas as dissertativas.", true);
    const vals = Object.fromEntries(sel.map(s => [s.dataset.auto, Number(s.value) * Number(s.dataset.max)]));
    salvar(db => { const p = db.progresso[aid]?.[tid]?.[mid]; const t = p?.tentativas.find(x => x.id === tid0); if (!t || t.status !== "autocorrecao") return;
      for (const [q, v] of Object.entries(vals)) t.notas[q].nota = v; t.nota = calcNota(t); t.aprovado = t.nota >= t.notaMin; t.status = "avaliada"; aplicarResultado(p, t, modPorId(mid)); }, `corrigiu dissertativas de ${mid}`, "Correção concluída.");
  },
  async "registrar-simulado"(el) {
    const n = Number(el.dataset.fase), aid = S.user.id, tid = TID(); const ac = Number(val("sm-ac")), tot = Number(val("sm-tot"));
    if (!(tot > 0) || isNaN(ac) || val("sm-ac") === "") return toast("Informe acertos e total.", true); if (ac > tot) return toast("Os acertos não podem passar do total.", true);
    const reg = { data: hoje(), prova: val("sm-prova"), acertos: ac, total: tot, tempo: Number(val("sm-tempo")) || null, obs: val("sm-obs"), nota: Math.max(0, ac / tot * 10) };
    salvar(db => { db.simulados[aid] = db.simulados[aid] || {}; db.simulados[aid][tid] = db.simulados[aid][tid] || {}; (db.simulados[aid][tid][n] = db.simulados[aid][tid][n] || []).push(reg); }, `registrou prova anterior da fase ${n}`, "Resultado registrado.");
  },
  "enviar-duvida"() {
    const texto = val("dv-txt"), modId = val("dv-mod") || null, aid = S.user.id, tid = TID(); if (texto.length < 10) return toast("Descreva a dúvida com um pouco mais de detalhe.", true);
    salvar(db => { db.duvidas.unshift({ id: "d" + uid(), aid, tid, modId, texto, em: new Date().toISOString(), respostas: [] }); }, `nova dúvida${modId ? " em " + modId : ""}`, "Dúvida publicada para a turma.");
  },
  responder(el) { const id = el.dataset.id, r = val("rd-" + id), aid = S.user.id; if (!r) return toast("Escreva a resposta.", true); salvar(db => { const d = db.duvidas.find(x => x.id === id); if (d) (d.respostas = d.respostas || []).push({ aid, texto: r, em: new Date().toISOString() }); }, "respondeu dúvida", "Resposta publicada."); },
  "toggle-questao"(el) { const q = el.dataset.q; salvar(db => { if (db.questoesOff[q]) delete db.questoesOff[q]; else db.questoesOff[q] = true; }, `questão ${q} alterada`); },
  async "apagar-questao"(el) { if (!(await confirmar("Excluir esta questão?", "Excluir"))) return; const { mod, q } = el.dataset; salvar(db => { db.questoesExtras[mod] = (db.questoesExtras[mod] || []).filter(x => x.id !== q); }, `questão ${q} excluída`); },
  "add-questao"(el) {
    const mid = el.dataset.mod; const tipo = val("nq-t-" + mid), enunciado = val("nq-e-" + mid), g = val("nq-g-" + mid), o = val("nq-o-" + mid); if (!enunciado) return toast("Escreva o enunciado.", true);
    const q = { id: `${mid}x${uid()}`, tipo, enunciado, explicacao: g, autor: S.user.id };
    if (tipo === "mc") { const l = o.split("\n").map(s => s.trim()).filter(Boolean); const c = l.findIndex(x => x.startsWith("*")); if (l.length < 2 || c < 0) return toast("Informe 2 ou mais alternativas e marque a correta com *.", true); q.opcoes = l.map(x => x.replace(/^\*\s*/, "")); q.correta = c; }
    else if (tipo === "ce") { if (!/^[CE]$/i.test(o)) return toast("Para certo ou errado, escreva C ou E no campo do gabarito.", true); q.certo = o.toUpperCase() === "C"; }
    else { q.esperado = g; delete q.explicacao; q.peso = 2; }
    salvar(db => { (db.questoesExtras[mid] = db.questoesExtras[mid] || []).push(q); }, `nova questão em ${mid}`, "Questão adicionada.");
  },
  "salvar-rotina"() { const capN = {}; for (const d of [0, 1, 2, 3, 4, 5, 6]) capN[d] = Math.max(0, Number(val("cap-" + d)) || 0); if (Object.values(capN).reduce((a, b) => a + b, 0) <= 0) return toast("Informe ao menos um dia com horas de estudo.", true);
    const livre = $("#cf-livre").checked, aid = S.user.id; salvar(db => { const a = db.alunos.find(x => x.id === aid); a.capacidade = capN; a.ordemLivre = livre; }, "rotina de estudo atualizada", "Rotina salva. Os próximos prazos já usam estas horas."); },
  async "salvar-perfil"() { const nome = val("p-nome"), pin = val("p-pin"), aid = S.user.id; if (pin && !pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true); const h = pin ? await hashPin(aid, pin) : null; salvar(db => { const a = db.alunos.find(x => x.id === aid); if (nome) a.nome = nome; if (h) a.pinHash = h; }, "acesso atualizado", "Acesso salvo."); },
  async "zerar-trilha"() { const tid = TID(); if (!(await confirmar(`Apagar todo o seu progresso na trilha ${TR[tid].nome} · ${TR[tid].cargo}? Testes, checklists e provas registradas serão apagados.`, "Apagar progresso"))) return; const aid = S.user.id;
    salvar(db => { if (db.progresso[aid]) delete db.progresso[aid][tid]; if (db.simulados[aid]) delete db.simulados[aid][tid]; const a = db.alunos.find(x => x.id === aid); a.trilhas[tid] = { inicio: hoje() }; }, `zerou a trilha ${tid}`, "Progresso apagado."); },
  async "salvar-config"() { const modo = $("input[name=modo]:checked").value; const c = { modo, owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") }; if (modo === "github" && (!c.owner || !c.repo || !c.token)) return toast("Preencha usuário, repositório e token.", true); Store.salvarCfg(c); toast("Configuração salva. Reconectando…"); setTimeout(() => location.reload(), 600); },
  async "testar-config"() {
    const c = { owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") }; const out = $("#c-res"); out.innerHTML = `<div class="aviso info">Testando…</div>`;
    try { const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: Store.hdr(c), cache: "no-store" }); if (!r.ok) throw new Error(r.status === 404 ? "Repositório não encontrado ou sem acesso com este token." : `GitHub respondeu ${r.status}.`);
      const j = await r.json(); const rb = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/branches/${encodeURIComponent(c.branch)}`, { headers: Store.hdr(c), cache: "no-store" }); if (rb.status === 404) throw new Error(`A branch "${c.branch}" não existe. Crie-a no GitHub ou corrija o nome.`);
      const { db } = await Store.ghGet(c); out.innerHTML = `<div class="aviso ok">Conectado a <b>${esc(j.full_name)}</b> (${j.private ? "privado" : "público"}), branch <b>${esc(c.branch)}</b>. ${db ? `Base encontrada com ${db.alunos?.length || 0} aluno(s).` : "A base será criada na primeira gravação."}</div>`; }
    catch (e) { out.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
  },
  exportar() { const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trilha-concursos-base-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  importar(el) { const f = el.files?.[0]; if (!f) return; const rd = new FileReader(); rd.onload = async () => { let n; try { n = migrar(JSON.parse(rd.result)); if (!Array.isArray(n.alunos)) throw 0; } catch { return toast("Arquivo inválido.", true); } if (!(await confirmar("Substituir a base atual pela do arquivo?", "Substituir"))) return; salvar(db => { Object.keys(db).forEach(k => delete db[k]); Object.assign(db, n); }, "base importada", "Base importada."); }; rd.readAsText(f); }
};
function aplicarResultado(p, t, m) {
  if (p.revisando) { p.revisando = false; t.revisao = true; p.status = "aprovado"; if (t.nota > (p.notaTeste ?? 0)) p.notaTeste = t.nota; return; }
  if (t.aprovado) { p.status = "aprovado"; p.notaTeste = t.nota; p.aprovadoEm = hoje(); }
  else { p.status = "reciclagem"; p.prazo = addHoras(hoje(), Math.max(1, m.horas / 2)); p.liberado = false; p.checklist = {}; t.novoPrazo = p.prazo; }
}
function fecharTentativa(db, aid, tid, mid, tent) {
  const p = db.progresso[aid]?.[tid]?.[mid]; if (!p) return; tent.n = p.tentativas.length + 1; p.tentativas.push(tent);
  if (tent.status === "avaliada") aplicarResultado(p, tent, modPorId(mid, tid)); else p.status = "autocorrecao";
}

window.addEventListener("hashchange", render);
window.addEventListener("beforeunload", e => { if (fila.length) { e.preventDefault(); e.returnValue = ""; } });
(async function iniciar() {
  try { S.user = JSON.parse(ss.get(K_SES) || "null"); } catch { S.user = null; }
  try { await Store.carregar(); } catch (e) { console.error(e); S.erroCarga = e.message || String(e); }
  if (S.user && !aluno(S.user.id)) S.user = null;
  render();
})();
</script>
